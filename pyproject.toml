[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-workbench"
version = "0.1.0"
description = "Local-first lead discovery, reviewed outreach, and reply tracking"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "selenium>=4.28,<5", "google-auth>=2.38,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
outreach-workbench = "workbench.cli:main"

[tool.setuptools.package-data]
workbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
